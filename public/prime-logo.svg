<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40">
  <!-- Black pill background -->
  <rect width="120" height="40" rx="10" fill="#050505"/>
  <!-- PRIME wordmark, centered (the old gold "P" box overlapped the first letter and read as "FRIME") -->
  <text x="60" y="21" dominant-baseline="middle" text-anchor="middle"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="17"
        fill="#F5C518" letter-spacing="3">PRIME</text>
</svg>
